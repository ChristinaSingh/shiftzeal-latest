name: shiftzeal
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_rating_bar: ^4.0.1
  provider: ^6.1.2
  responsive_sizer:
  flutter_svg:
  cached_network_image:
  internet_connection_checker:
  pin_code_fields:
  shimmer:
  shared_preferences:
  image_cropper:
  image_picker:
  upgrader:
  google_nav_bar:
  get: ^4.6.5
  fluttertoast: ^8.2.8
  flutter_html:
  intl: ^0.19.0
  flutter_launcher_icons: ^0.14.1
  #simple_vertical_calendar:
  flutter_image_stack: ^0.0.7
  calendar_date_picker2: ^1.1.7
  url_launcher: ^6.3.1
  dropdown_search: ^6.0.1
  easy_date_timeline: ^1.1.1
  win32: ^5.10.0
  table_calendar: ^3.1.2
  percent_indicator: ^4.2.4
  loading_animation_widget: ^1.3.0
  fl_chart: ^0.66.0
  geocoding: ^2.2.2
  location: ^7.0.1
  file_picker: ^8.0.0
  permission_handler: ^11.3.1
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  image_path: "assets/images/ic_app_logo.png"
  android:
    adaptive_icon_background: "#FFFFFF"
    adaptive_icon_foreground: "assets/images/ic_app_logo.png"
    round_icon: true
  ios:
    image_path_ios: "assets/images/ic_app_logo.png"
    remove_alpha_ios: true
    precomposed: true



flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700



